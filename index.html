<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="月・エウロパ・木星をめぐる宇宙の旅。メアリー・セレスト号の日記と置き手紙を追いかけよう">
<title>星くずの旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 一画面のゲーム。宇宙の黒をベースにした単一テーマ。 */
:root{
  --space:#05060f;
  --ink:#eef0ff;
  --dim:#9aa0c4;
  --glass:rgba(20,24,52,.62);
  --line:rgba(170,180,255,.22);
  --gold:#ffd27a;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;}
[hidden]{display:none!important;}
body{margin:0;background:var(--space);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;}
.info{display:flex;flex-direction:column;gap:2px;min-width:0;}
.info .label{font-size:12px;color:var(--dim);letter-spacing:.08em;}
.info .big{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(120,140,255,.45);}
.info .sub{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto;}
button{font-family:var(--font);font-weight:700;font-size:13px;color:var(--ink);background:var(--glass);
  border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
button.on{border-color:var(--gold);color:var(--gold);}
button.go{border-color:rgba(255,210,122,.6);}
.hint{position:fixed;left:0;right:0;bottom:0;text-align:center;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-size:13px;line-height:1.5;color:var(--ink);pointer-events:none;transition:opacity .6s;text-shadow:0 1px 2px rgba(0,0,10,.95),0 0 10px rgba(0,0,10,.9);}
.bottombar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
  padding-bottom:calc(58px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.banner{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
  font-size:30px;font-weight:900;letter-spacing:.12em;text-shadow:0 0 24px rgba(255,220,150,.6);opacity:0;transition:opacity .8s;width:90%;}
.banner.hell{color:#ffd2c4;text-shadow:0 0 22px rgba(255,80,50,.9);}
.banner small{display:block;font-size:14px;font-weight:500;letter-spacing:.04em;color:var(--ink);margin-top:8px;text-shadow:0 1px 8px rgba(0,0,0,.9);}
.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 32px));
  background:rgba(14,18,44,.82);border:1px solid var(--line);border-radius:22px;padding:22px 20px;text-align:center;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-sizing:border-box;}
.card h2{margin:0;font-size:26px;font-weight:900;letter-spacing:.1em;text-shadow:0 0 18px rgba(120,170,255,.6);}
.card p{margin:6px 0 14px;color:var(--dim);font-size:13px;}
.card.diary{background:#f4ecd8;border-color:#c9a978;color:#3b2c22;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 18px 50px rgba(0,0,0,.6);}
.diary .dday{margin:0 0 10px;color:#9a6a3a;font-size:13px;font-weight:700;letter-spacing:.1em;text-align:left;}
.diary .dtext{margin:0 0 18px;color:#3b2c22;font-size:16px;line-height:1.95;text-align:left;min-height:7.8em;}
.diary .dnav{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:#9a6a3a;font-variant-numeric:tabular-nums;}
.diary button{color:#3b2c22;background:rgba(120,80,40,.1);border-color:rgba(120,80,40,.35);backdrop-filter:none;-webkit-backdrop-filter:none;}
.diary .dtext{white-space:pre-line;}
.card.diary.letter{background:#e8f0f6;border-color:#9ab4c9;color:#24384a;}
.letter .dday{color:#4f6f8f;}
.letter .dtext{color:#24384a;}
.card.diary.party{background:#fdf0e2;border-color:#e0a878;}
.party .dday{color:#c0603e;}
.card.diary.spec{background:#eef2e4;border-color:#a7b88a;color:#2e3a22;}
.spec .dday{color:#5f7a3a;}
.spec .dtext{color:#2e3a22;}
.rec{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;text-align:left;margin:0 0 18px;font-variant-numeric:tabular-nums;font-size:14px;}
.rec dt{font-weight:700;color:var(--gold);}
.rec dd{margin:0;}
.cbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.card p.warn{margin:12px 0 0;color:#ffc9b8;font-size:12px;line-height:1.6;}
.card p.boxrow{margin:12px 0 0;}
.card p.saved{margin:12px 0 0;font-size:11px;}
</style>
</head>
<body>
<canvas id="c" aria-label="宇宙を旅して、月・エウロパ・木星の上を歩くゲーム画面"></canvas>

<div class="hud">
  <div class="info">
    <span class="label" id="lab">月まで あと</span>
    <span class="big" id="big">384,400 km</span>
    <span class="sub" id="sub">くだいた隕石 0こ</span>
  </div>
  <div class="btns">
    <button id="snd" type="button" aria-pressed="false">音 オフ</button>
  </div>
</div>

<div class="bottombar" id="walkbar" hidden>
  <button id="grav" type="button">重力：月（地球の1/6）</button>
  <button id="next" type="button" class="go">エウロパへ飛ぶ</button>
</div>

<div class="hint" id="hint">隕石をタップしてくだき、月へ進もう</div>
<div class="banner" id="banner"><span id="bt">月に到着</span><small id="bs">タップで一歩</small></div>

<div class="bottombar" id="scopebar" hidden>
  <button id="scopeexit" type="button" class="go">望遠鏡からはなれる</button>
</div>

<div class="bottombar" id="shipbar" hidden>
  <button id="shipexit" type="button" class="go">船を出る</button>
</div>

<div class="card diary" id="diary" hidden role="dialog" aria-label="残された日記">
  <p class="dday" id="dday">第1日</p>
  <p class="dtext" id="dtext"></p>
  <div class="dnav"><button id="dprev" type="button">まえ</button><span id="dpg">1 / 7</span><button id="dnext" type="button">つぎ</button></div>
</div>

<div class="card" id="start" hidden role="dialog" aria-label="旅のつづき">
  <h2>星くずの旅</h2>
  <p id="startmsg">前の旅の記録が残っています</p>
  <dl class="rec" id="startrec"></dl>
  <div class="cbtns"><button id="cont" type="button" class="go">つづきから</button><button id="fresh" type="button">はじめから</button></div>
  <p class="boxrow"><button id="box1" type="button">標本箱をひらく</button></p>
  <p class="warn" id="freshwarn" hidden>日記・置き手紙・モフとの記録が消えます。もう一度おすと、はじめからになります</p>
</div>

<div class="card" id="card" hidden>
  <h2>おかえりなさい</h2>
  <p id="trips">地球に帰ってきました</p>
  <dl class="rec" id="rec"></dl>
  <div class="cbtns"><button id="restart" type="button" class="go">もう一度旅に出る</button><button id="box2" type="button">標本箱</button></div>
  <p class="saved">記録は、このブラウザに残ります</p>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const FONT=getComputedStyle(document.documentElement).getPropertyValue('--font');
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);initStars();}

/* ---------- 星と旅のデータ ---------- */
const STAGES={
  moon:{name:'月',g:1/6,gtxt:'地球の1/6',word:'ジャリ・ジャリ',step:'ジャリ',
    fact:'重力は地球の約1/6。空気がないので、砂ぼこりはそのまま落ちる'},
  europa:{name:'エウロパ',g:.134,gtxt:'地球の約1/7',word:'キーン、キーン',step:'キン',
    fact:'木星の衛星。表面は厚い氷でおおわれ、気温はおよそ−160℃'},
  jupiter:{name:'木星',g:2.53,gtxt:'地球の約2.5倍',word:'ぼよよ〜ん',step:'ふわ',
    fact:'重力は地球の約2.5倍。本当は地面がなく、ここは雲のてっぺん'}
};
const LEGS=[
  {from:'earth',to:'moon',need:30,km:384400,ice:false},
  {from:'moon',to:'europa',need:36,km:628000000,ice:true},
  {from:'europa',to:'jupiter',need:20,km:670900,ice:true}
];
const HELLS={
  moon:{name:'隕石の雨地獄',fact:'空気がないので、小さな隕石も燃えつきずに地面まで降ってくる',how:'落ちてくる隕石にふれて、くだこう',unit:'くだいた隕石'},
  europa:{name:'氷の噴水地獄',fact:'氷の下には海があり、割れ目から水が宇宙へ噴き出しているかもしれない',how:'舞い上がった氷の結晶にふれて、集めよう',unit:'集めた結晶'},
  jupiter:{name:'雷と暴風の地獄',fact:'大赤斑は地球がまるごと入るほどの嵐。風は時速400kmをこえ、雷も光る',how:'タップで風に負けずに進もう。雷の光の玉にもふれてみて',unit:'光の玉'}
};
const HELL_DUR=16;

/* ---------- 音 ---------- */
let AC=null,sound=false,master=null,NB=null;
function ac(){
  if(!AC||AC.state==='closed'){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.7;master.connect(AC.destination);NB=null;}
  if(AC.state!=='running')AC.resume().catch(()=>{});   // suspended だけでなく interrupted（電話や画面ロックのあと）も起こす
  return AC;}
function wake(){if(sound){try{ac();}catch(e){}}}       // 次にふれたとき、止まった音を起こし直す
addEventListener('pointerdown',wake,true);
addEventListener('touchend',wake,true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake();});
addEventListener('pageshow',wake);
function noiseBuf(len){const a=ac(),b=a.createBuffer(1,a.sampleRate*len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
function grain(t,freq,q,dur,vol){const a=ac();if(!NB)NB=noiseBuf(3);const s=a.createBufferSource();s.buffer=NB;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.8);s.stop(t+dur+.02);}
function tone(t,f0,f1,dur,vol,type='sine'){const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}
function sJari(soft){const t=ac().currentTime,v=soft?.25:.5;
  for(let i=0;i<(soft?3:6);i++)grain(t+i*rnd(.018,.04),rnd(1800,4200),rnd(.8,2),rnd(.04,.09),v*rnd(.5,1));
  grain(t,320,.7,.12,v*.6);}
function sKiin(soft){const t=ac().currentTime;
  tone(t,2637,2620,soft?.35:.8,soft?.05:.09);tone(t,3951,3940,soft?.25:.6,.035);grain(t,7000,3,.04,.12);
  if(!soft){tone(t+.2,2794,2780,.8,.08);tone(t+.2,4186,4170,.6,.03);grain(t+.2,7500,3,.04,.1);}}
function sBoyon(){const a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(100,t);o.frequency.linearRampToValueAtTime(250,t+.12);o.frequency.exponentialRampToValueAtTime(140,t+1.2);
  l.frequency.value=7.5;lg.gain.setValueAtTime(55,t);lg.gain.exponentialRampToValueAtTime(2,t+1.2);l.connect(lg);lg.connect(o.frequency);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.3,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+1.3);
  o.connect(g);g.connect(master);o.start(t);l.start(t);o.stop(t+1.35);l.stop(t+1.35);}
function sPuff(){const t=ac().currentTime;grain(t,500,.6,.25,.3);}
function sStep(id){if(!sound)return;if(id==='moon')sJari(true);else if(id==='europa')sKiin(true);else sPuff();tone(ac().currentTime,260,520,.35,.04);}
function sLand(id){if(!sound)return;if(id==='moon')sJari(false);else if(id==='europa')sKiin(false);else sBoyon();}
function sBreak(ice){if(!sound)return;const t=ac().currentTime;
  if(ice){grain(t,5200,2,.12,.5);tone(t,3136,3100,.5,.06);tone(t+.05,4699,4650,.4,.04);tone(t,180,70,.2,.2,'triangle');}
  else{grain(t,rnd(700,1100),1,.18,.7);grain(t+.02,2600,1.5,.1,.35);tone(t,160,55,.25,.35,'triangle');}}
function sChime(){if(!sound)return;const t=ac().currentTime;[523,659,784,1047].forEach((f,i)=>tone(t+i*.16,f,f*.999,1.4,.12));}
function noiseLong(t,dur,freq,q,vol,att,type='bandpass'){const a=ac();if(!NB)NB=noiseBuf(3);const s=a.createBufferSource();s.buffer=NB;s.loop=true;
  const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=a.createGain();
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.linearRampToValueAtTime(vol*.8,t+dur*.7);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.05);}
function sStatic(d){const a=ac(),t=a.currentTime;if(!NB)NB=noiseBuf(3);const s=a.createBufferSource();s.buffer=NB;s.loop=true;
  const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=.5;const g=a.createGain();
  g.gain.setValueAtTime(0,t);for(let k=0;k<d*20;k++)g.gain.setValueAtTime(rnd(.02,.2),t+k*.05);g.gain.setValueAtTime(0,t+d);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.05);
  [0,.12,.24,.6,.72,.84].forEach(o=>tone(t+.4+o,1450,1450,.07,.05,'square'));}
function sBeep(f){const t=ac().currentTime;tone(t,f,f,.18,.06,'square');tone(t,f*2,f*2,.18,.03);}
function sMorse(){const t=ac().currentTime;[0,.1,.2,.45,.55,.8,.9,1,1.3].forEach((o,i)=>{const f=1200+(i%3)*200;tone(t+o,f,f,.07,.05,'square');});}
function sPowan(){const t=ac().currentTime;tone(t,420,880,.6,.1);tone(t+.08,630,1320,.55,.05);}
function sPing(){const t=ac().currentTime;tone(t,1760,1750,.4,.07);tone(t+.06,2637,2630,.4,.05);}
function sThud(){const t=ac().currentTime;grain(t,180,.6,.5,.8);tone(t,110,40,.45,.45,'triangle');}
function sWhistle(){const t=ac().currentTime;tone(t,1800,500,.5,.025);}
function sPlume(){noiseLong(ac().currentTime,1.8,1600,.7,.22,.3);}
function sThunder(){const t=ac().currentTime;grain(t,4200,.6,.12,.7);grain(t+.02,900,.6,.2,.5);noiseLong(t+.05,2,110,.6,.9,.15,'lowpass');}
function sZap(){const t=ac().currentTime;tone(t,1800,3600,.15,.06,'triangle');tone(t+.08,2400,4800,.2,.04);}
function sOminous(){const t=ac().currentTime;tone(t,82,60,2,.22,'triangle');tone(t+.1,123,92,2,.1,'triangle');}

$('snd').onclick=e=>{e.stopPropagation();sound=!sound;if(sound){ac();sChime();}
  $('snd').textContent=sound?'音 オン':'音 オフ';$('snd').classList.toggle('on',sound);$('snd').setAttribute('aria-pressed',sound);};

/* ---------- 星空 ---------- */
let stars=[];
function initStars(){stars=[];const n=Math.round(W*H/2600);for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:rnd(.2,1),tw:rnd(0,6.28)});}
function drawStars(dt,speed,camX,alpha=1){for(const s of stars){s.y+=speed*s.z*dt;if(s.y>H){s.y-=H;s.x=Math.random()*W;}
  s.tw+=dt*2;const a=(.35+.45*s.z*(.75+.25*Math.sin(s.tw)))*alpha;let x=s.x;if(camX!==undefined){x=((s.x-camX*.04*s.z)%W+W)%W;}
  cx.fillStyle=`rgba(225,230,255,${a})`;cx.fillRect(x,s.y,s.z*1.8,s.z*1.8);}}

/* ---------- 星の絵 ---------- */
const moonSpots=[...Array(14)].map(()=>({a:rnd(0,6.28),d:Math.sqrt(Math.random())*.8,r:rnd(.05,.17)}));
function glowDisc(x,y,r,stops,glow){const g=cx.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);stops.forEach(([o,c])=>g.addColorStop(o,c));
  cx.save();cx.shadowColor=glow;cx.shadowBlur=r*.4;cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();cx.restore();}
function shade(x,y,r,from=.62,a=.55){const sh=cx.createLinearGradient(x-r,y,x+r,y);sh.addColorStop(0,'rgba(0,0,10,0)');sh.addColorStop(from,'rgba(0,0,10,0)');sh.addColorStop(1,`rgba(0,0,15,${a})`);cx.fillStyle=sh;cx.fillRect(x-r,y-r,r*2,r*2);}
function drawMoon(x,y,r){
  glowDisc(x,y,r,[[0,'#f1efe8'],[.7,'#c9c6bd'],[1,'#8e8b84']],'rgba(230,230,255,.35)');
  cx.save();cx.beginPath();cx.arc(x,y,r,0,7);cx.clip();
  for(const s of moonSpots){const sx=x+Math.cos(s.a)*s.d*r,sy=y+Math.sin(s.a)*s.d*r;
    cx.fillStyle='rgba(110,106,100,.35)';cx.beginPath();cx.arc(sx,sy,s.r*r,0,7);cx.fill();
    cx.strokeStyle='rgba(255,255,250,.25)';cx.lineWidth=Math.max(.5,r*.012);cx.beginPath();cx.arc(sx-s.r*r*.15,sy-s.r*r*.15,s.r*r,Math.PI*.9,Math.PI*1.7);cx.stroke();}
  shade(x,y,r);cx.restore();}
function drawEarth(x,y,r){
  glowDisc(x,y,r,[[0,'#7fc3ff'],[.7,'#2c6fd1'],[1,'#163a8a']],'rgba(90,160,255,.6)');
  cx.save();cx.beginPath();cx.arc(x,y,r,0,7);cx.clip();
  cx.fillStyle='rgba(80,170,110,.85)';
  [[-.3,-.1,.32,.22],[.25,.2,.28,.18],[.1,-.45,.18,.12]].forEach(([a,b,c,d])=>{cx.beginPath();cx.ellipse(x+a*r,y+b*r,c*r,d*r,.4,0,7);cx.fill();});
  cx.fillStyle='rgba(255,255,255,.75)';
  [[-.5,.35,.35,.06],[.2,-.25,.4,.05],[-.1,.6,.3,.05]].forEach(([a,b,c,d])=>{cx.beginPath();cx.ellipse(x+a*r+Math.sin(T*.3)*r*.05,y+b*r,c*r,d*r,0,0,7);cx.fill();});
  const sh=cx.createLinearGradient(x-r,y,x+r,y);sh.addColorStop(0,'rgba(0,0,15,.6)');sh.addColorStop(.45,'rgba(0,0,15,0)');cx.fillStyle=sh;cx.fillRect(x-r,y-r,r*2,r*2);
  cx.restore();}

function frameWalk(dt){

  if(player.air){player.vy-=g*dt;player.h+=player.vy*dt;player.x+=player.vx*dt;player.maxH=Math.max(player.maxH,player.h);

    for(let i=e.dust.length-1;i>=0;i--){const d=e.dust[i];d.x+=d.vx*dt;d.y+=d.vy*dt;d.vx*=.99;d.rot+=dt*2;d.life-=dt*.13;if(d.life<=0||d.y>H+20)e.dust.splice(i,1);}

function scopeEuropa(dt,e,c,R){e.zv=lerp(e.zv,e.zoom,Math.min(1,dt*4));const k=(e.zv-1)/5,sr=R*(.035+k*.5);

function scopeJupiter(dt,e,c,R){const jx=c.x+R*.25,jy=c.y+R*1.55,jr=R*1.25;
  drawJupiter(jx,jy,jr,.3);
  for(const s of e.spots){s.t+=dt;const g=1+Math.min(1,s.t);cx.fillStyle=`rgba(40,20,20,${Math.min(.6,s.t*2)})`;
    cx.beginPath();cx.ellipse(s.x,s.y,s.r*g,s.r*.45*g,s.rot,0,7);cx.fill();}
  for(const f of e.items){if(f.hit)continue;f.p+=dt*(f.fast?1.1:.12);if(f.p<0)continue;

    cx.fillStyle=`rgba(255,240,200,${(1-k)*.9})`;cx.beginPath();cx.arc(b.x,b.y,4+k*R*.18,Math.PI,0);cx.fill();

/* ---------- 寄り道：ブラックホール ---------- */
function fmtClock(sec){if(sec<60)return `${sec.toFixed(1)}秒`;const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s2=Math.floor(sec%60);
  if(d>=1)return `${d}日${h}時間`;if(h>=1)return `${h}時間${m}分`;return `${m}分${s2}秒`;}
function startBH(){ev={type:'bh',stage:'pull',t:0,self:0,far:0,x:0,esc:0,sp:[]};
  $('hint').textContent='ワープの途中で、船が強い重力につかまった！ 見えない黒い星――ブラックホールだ';$('hint').style.opacity=1;
  showBanner('ブラックホール','光さえぬけ出せない星',true,2800);if(sound)sOminous();updateHud();}
function bhHud(){const e=ev;$('lab').textContent='寄り道：ブラックホール';$('big').textContent=`時間のずれ ×${Math.round(Math.exp(e.x)).toLocaleString()}`;

  floats.push({x:px,y:py-20,txt:'ゴォッ',life:.6,small:true});if(sound){const t=ac().currentTime;grain(t,220,.6,.25,.5);}

  for(let r=Rb*1.4;r<Rb*3.2;r+=Rb*.12){const a0=back?Math.PI:0;

  updateHud();}

  // 帆と船
  if(L2>0){cx.save();cx.lineCap='round';
    cx.strokeStyle='rgba(200,210,235,.6)';cx.lineWidth=1;cx.beginPath();cx.moveTo(c.x,c.y);cx.lineTo(c.x+tv.x*L2,c.y+tv.y*L2);cx.moveTo(c.x,c.y);cx.lineTo(c.x-tv.x*L2,c.y-tv.y*L2);cx.stroke();
    const g=cx.createLinearGradient(c.x-tv.x*L2,c.y-tv.y*L2,c.x+tv.x*L2,c.y+tv.y*L2);g.addColorStop(0,'#9fb6d8');g.addColorStop(.5,`rgba(255,255,255,${.7+.3*P})`);g.addColorStop(1,'#9fb6d8');
    cx.strokeStyle=g;cx.lineWidth=5;cx.shadowColor='rgba(220,235,255,.9)';cx.shadowBlur=12;cx.beginPath();cx.moveTo(c.x-tv.x*L2,c.y-tv.y*L2);cx.lineTo(c.x+tv.x*L2,c.y+tv.y*L2);cx.stroke();cx.restore();}
  cx.fillStyle='#dfe3ee';cx.beginPath();cx.arc(c.x+n.x*10,c.y+n.y*10,8,0,7);cx.fill();cx.fillStyle='#4a6fb0';cx.beginPath();cx.arc(c.x+n.x*10,c.y+n.y*10,3.5,0,7);cx.fill();
  if(e.stage==='sail'){const eff=sailEff(e.phi),F=Math.max(0,Math.cos(e.phi)**2)*P,len=20+70*Math.min(1,F*2.2);
    cx.strokeStyle='rgba(140,255,220,.85)';cx.fillStyle='rgba(140,255,220,.85)';cx.lineWidth=3;const ax=c.x+n.x*22,ay=c.y+n.y*22,bx=ax+n.x*len,by=ay+n.y*len;
    cx.beginPath();cx.moveTo(ax,ay);cx.lineTo(bx,by);cx.stroke();cx.beginPath();cx.moveTo(bx+n.x*8,by+n.y*8);cx.lineTo(bx-n.y*6,by+n.x*6);cx.lineTo(bx+n.y*6,by-n.x*6);cx.fill();
    // 効率メーター
    const mw=Math.min(240,W*.6),mx=(W-mw)/2,my=H*.86;cx.fillStyle='rgba(20,24,52,.7)';cx.beginPath();cx.roundRect(mx-12,my-30,mw+24,48,12);cx.fill();
    cx.font=`700 12px ${FONT}`;cx.textAlign='center';cx.fillStyle='#d8dcff';
    cx.fillText(`帆の角度 ${Math.round(e.phi*180/Math.PI)}度　上へ進む力 ${Math.max(0,Math.round(eff*100))}%`,W/2,my-12);
    cx.fillStyle='rgba(255,255,255,.12)';cx.beginPath();cx.roundRect(mx,my-2,mw,8,4);cx.fill();
    cx.fillStyle=eff>.95?'#9dffd9':eff>0?'#ffd27a':'#ff8a7a';cx.beginPath();cx.roundRect(mx,my-2,mw*Math.max(.02,Math.min(1,Math.abs(eff))),8,4);cx.fill();
    cx.font=`900 22px ${FONT}`;cx.fillStyle=`rgba(255,255,255,${sailHold<0?.9:.35})`;cx.fillText('↺',24,my+4);cx.fillStyle=`rgba(255,255,255,${sailHold>0?.9:.35})`;cx.fillText('↻',W-24,my+4);}
  drawFloats(dt);}
function sailHud(){const r=sunR();$('lab').textContent='光の帆（ソーラーセイル）';$('big').textContent=`太陽から ${(r*AU_KM/1e8).toFixed(2)}億 km`;
  $('sub').textContent=`光の強さ ${Math.round(sunPct(r))}%・日なた 約${sunTemp(r)}℃`;}

/* ---------- 星から見た太陽 ---------- */
const SUNINFO={
  moon:{pct:'地球とほぼ同じ（100%）',size:'地球で見るのと同じ大きさ',time:'約8分20秒',temp:'空気がないので、昼は約110℃、夜は約−170℃'},
  europa:{pct:'地球の約1/27（3.7%）',size:'地球で見る大きさの約1/5',time:'約43分',temp:'昼でも約−160℃'},
  jupiter:{pct:'地球の約1/27（3.7%）',size:'地球で見る大きさの約1/5',time:'約43分',temp:'雲のてっぺんは約−145℃'}};
const SUNPOS={moon:()=>({x:W*.14,y:H*.1,r:Math.min(W,H)*.03}),europa:()=>({x:W*.16,y:H*.13,r:Math.min(W,H)*.02}),jupiter:()=>({x:W*.22,y:H*.2,r:Math.min(W,H)*.022})};
let sunSeen={};
function drawSkySun(){const p=SUNPOS[cur](),g=cx.createRadialGradient(p.x,p.y,p.r*.5,p.x,p.y,p.r*(cur==='moon'?7:5));
  g.addColorStop(0,`rgba(255,240,200,${cur==='moon'?.55:.3})`);g.addColorStop(1,'rgba(255,220,150,0)');cx.fillStyle=g;cx.fillRect(p.x-p.r*8,p.y-p.r*8,p.r*16,p.r*16);
  if(cur==='moon')smallBall(p.x,p.y,p.r,'#fffdf2','#ffd27a');
  if(!sunSeen[cur]){const a=.35+.35*Math.sin(T*3);cx.strokeStyle=`rgba(255,230,160,${a})`;cx.lineWidth=1.5;cx.beginPath();cx.arc(p.x,p.y,p.r+9+4*Math.sin(T*3),0,7);cx.stroke();}}
function sunTap(px,py){if(ev||comm)return false;const p=SUNPOS[cur]();if(Math.hypot(px-p.x,py-p.y)>Math.max(30,p.r*2.5))return false;
  const s=SUNINFO[cur];sunSeen[cur]=true;if(sound)sPowan();
  openBook([[`${STAGES[cur].name}から見た太陽`,`光の強さ：${s.pct}\n大きさ：${s.size}\n\nいま見えている太陽は、${s.time}前に太陽を出た光。\n\n${s.temp}`]],'太陽',null,'letter');return true;}

/* ---------- イベント：謎の電波攻撃 ---------- */
let glitch=0,atkLog={};
const ATK={
  sun:{title:'正体は、太陽フレアの電波バースト',from:'太陽のほう',spec:'rec-sun',src:()=>({x:-30,y:H*.12})},
  jupiter:{title:'正体は、木星の電波嵐',from:'木星のほう',spec:'rec-jupiter',src:()=>({x:W*.62,y:H*.24})}
};
const ATK_DUR=13;
function sAlarm(){if(!sound)return;const t=ac().currentTime;for(let i=0;i<3;i++){tone(t+i*.36,880,660,.3,.06,'square');}}
function startAtk(kind){ev={type:'atk',kind,stage:'warn',t:0,blobs:[],rings:[],spawn:.4,ringT:.5,got:0,hits:0};
  meteors.forEach(m=>{m.vx*=2.5;m.vy*=2.5;});showBanner('警告：謎の電波攻撃','飛んでくるノイズにふれて、打ち消そう',true,2800);
  $('hint').textContent='計器がみだれている…！ 画面のまん中に届く前に、ノイズを消そう';$('hint').style.opacity=1;sAlarm();}
function atkTap(px,py){const e=ev;if(e.stage!=='attack')return false;
  for(let i=e.blobs.length-1;i>=0;i--){const b=e.blobs[i];if(Math.hypot(px-b.x,py-b.y)<36){e.blobs.splice(i,1);e.got++;
    floats.push({x:b.x,y:b.y-14,txt:'ピッ',life:.6,small:true});if(sound){const t=ac().currentTime;tone(t,1900,2400,.08,.05,'square');}updateHud();return true;}}
  return false;}
function atkFrame(dt){if(!ev||ev.type!=='atk')return;const e=ev,cfg=ATK[e.kind],s=cfg.src(),cxp=W/2,cyp=H*.5;e.t+=dt;
  if(e.stage==='warn'&&e.t>1.8){e.stage='attack';e.t=0;if(sound)sStatic(1);}
  if(e.stage==='attack'){
    e.spawn-=dt;if(e.spawn<=0&&e.t<ATK_DUR-1.5){e.spawn=rnd(.32,.6)*(1-e.t/ATK_DUR*.4);
      const a=Math.atan2(cyp-s.y,cxp-s.x)+rnd(-.9,.9),d=Math.max(W,H)*.75;
      e.blobs.push({x:cxp-Math.cos(a)*d*rnd(.75,1),y:cyp-Math.sin(a)*d*rnd(.75,1),sp:rnd(80,125)*(1+e.t/ATK_DUR*.5),ph:rnd(0,6)});}
    e.ringT-=dt;if(e.ringT<=0){e.ringT=1.6;e.rings.push({r:0});}
    for(let i=e.blobs.length-1;i>=0;i--){const b=e.blobs[i],dx=cxp-b.x,dy=cyp-b.y,dd=Math.hypot(dx,dy);b.ph+=dt*6;
      b.x+=dx/dd*b.sp*dt+Math.cos(b.ph)*18*dt;b.y+=dy/dd*b.sp*dt+Math.sin(b.ph*1.3)*18*dt;
      if(dd<26){e.blobs.splice(i,1);e.hits++;glitch=Math.max(glitch,.9);shake=8;if(sound)sStatic(.35);}}
    if(e.t>ATK_DUR&&!e.blobs.length){e.stage='reveal';e.t=0;atkLog[e.kind]={got:e.got,hits:e.hits};
      const fresh=addSpec(cfg.spec);showBanner(cfg.title,fresh?'電波を録音して、標本箱にしまった':'録音は、もう標本箱にある',false,3600);
      $('hint').textContent=SPECS[cfg.spec].fact;sChime();}
    updateHud();}
  for(let i=e.rings.length-1;i>=0;i--){const r=e.rings[i];r.r+=dt*Math.max(W,H)*.45;if(r.r>Math.max(W,H)*1.6)e.rings.splice(i,1);}
  if(e.stage==='reveal'&&e.t>5.5){ev=null;$('hint').textContent=flyHint();updateHud();return;}
  drawAtk(e,s,cxp,cyp);}
function drawAtk(e,s,cxp,cyp){const k=e.stage==='reveal'?Math.max(0,1-e.t/1.5):1;
  if(e.stage==='warn'||e.stage==='attack'){const pul=.18+.1*Math.sin(T*10);
    const v=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.8);v.addColorStop(0,'rgba(255,40,60,0)');v.addColorStop(1,`rgba(255,40,60,${pul})`);cx.fillStyle=v;cx.fillRect(0,0,W,H);}
  for(const r of e.rings){cx.strokeStyle=`rgba(255,120,200,${.35*k})`;cx.lineWidth=3;cx.beginPath();cx.arc(s.x,s.y,r.r,0,7);cx.stroke();}
  if(e.stage==='attack'){cx.strokeStyle='rgba(191,255,233,.5)';cx.lineWidth=1.5;cx.setLineDash([4,6]);cx.beginPath();cx.arc(cxp,cyp,26,0,7);cx.stroke();cx.setLineDash([]);
    cx.beginPath();cx.moveTo(cxp-38,cyp);cx.lineTo(cxp-30,cyp);cx.moveTo(cxp+30,cyp);cx.lineTo(cxp+38,cyp);cx.moveTo(cxp,cyp-38);cx.lineTo(cxp,cyp-30);cx.moveTo(cxp,cyp+30);cx.lineTo(cxp,cyp+38);cx.stroke();}
  for(const b of e.blobs){for(let i=0;i<9;i++){const ox=Math.sin(b.ph*3+i*2.1)*11,oy=Math.cos(b.ph*2.3+i*1.7)*11,sz=rnd(3,7);
      cx.fillStyle=i%3?`rgba(255,${120+i*12},220,.85)`:'rgba(255,255,255,.9)';cx.fillRect(b.x+ox-sz/2,b.y+oy-sz/2,sz,sz);}
    cx.strokeStyle='rgba(255,140,220,.5)';cx.lineWidth=1.5;cx.beginPath();cx.arc(b.x,b.y,18+Math.sin(b.ph*4)*3,0,7);cx.stroke();}
  if(e.stage==='warn'){cx.save();cx.globalAlpha=.6+.4*Math.sin(T*14);cx.font=`900 ${Math.min(30,W/12)}px ${FONT}`;cx.textAlign='center';cx.fillStyle='#ffd0e8';
    cx.shadowColor='rgba(255,60,120,1)';cx.shadowBlur=18;cx.fillText('ザ…ザザ…ガ…',W/2,H*.42);cx.restore();}
  if(e.stage==='reveal'){const a=Math.min(1,e.t/.8)*Math.min(1,(5.5-e.t)/.8);cx.save();cx.globalAlpha=a;cx.textAlign='center';
    cx.strokeStyle='rgba(140,255,220,.8)';cx.lineWidth=2;cx.shadowColor='rgba(120,255,210,.8)';cx.shadowBlur=8;cx.beginPath();
    for(let i=0;i<=80;i++){const x=W*.1+W*.8*i/80,y=H*.72+Math.sin(i*.45+T*9)*Math.sin(i*.07+T*2)*16;i?cx.lineTo(x,y):cx.moveTo(x,y);}cx.stroke();
    cx.font=`700 13px ${FONT}`;cx.fillStyle='#bfffe9';cx.fillText(`${ATK[e.kind].from}から届いた電波　打ち消したノイズ ${e.got}こ`,W/2,H*.72-30);cx.restore();}}
function applyGlitch(dt){if(glitch<=0)return;glitch=Math.max(0,glitch-dt*1.1);
  for(let i=0;i<7;i++){const sy=rnd(0,H),h=rnd(4,26),off=rnd(-36,36)*glitch;
    try{cx.drawImage(cv,0,sy*DPR,W*DPR,h*DPR,off,sy,W,h);}catch(e){}}
  cx.fillStyle=`rgba(140,255,220,${.1*glitch})`;cx.fillRect(0,0,W,H);
  if(Math.random()<glitch*.6){cx.fillStyle=`rgba(255,80,200,${.12*glitch})`;cx.fillRect(0,rnd(0,H),W,rnd(10,40));}}
function garble(s){const g='＃％＆＠？！ア゛ザ※▒░';return [...s].map(c=>Math.random()<.5?g[Math.floor(Math.random()*g.length)]:c).join('');}

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  if(phase==='fly')frameFly(dt,false);else if(phase==='landing')frameFly(dt,true);
  else if(phase==='walk')frameWalk(dt);else if(phase==='ship'||phase==='party')frameShip(dt);else frameHome(dt);
  applyGlitch(dt);
  requestAnimationFrame(loop);}
/* ---------- つづきから／はじめから ---------- */
function showStart(){
  if(!trips&&!diaryRead&&!petJoined&&!Object.keys(traces).length&&!specs.size)return;
  const rec=$('startrec');rec.innerHTML='';
  const row=(a,b)=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=a;dd.textContent=b;rec.append(dt,dd);};
  row('旅',trips?`${trips}回 地球に帰ってきた`:'まだ帰っていない');
  row('日記',diaryRead?'読んだ':'まだ');
  if(diaryRead)row('置き手紙',`${Object.keys(traces).length} / 3 まい`+(Object.keys(traces).length?`（${['moon','europa','jupiter'].filter(k=>traces[k]).map(k=>STAGES[k].name).join('・')}）`:''));
  if(petJoined)row('相棒','モフ');
  if(partyEver)row('おちゃかい','みんなでお茶を飲んだ');
  if(specs.size)row('標本箱',`${specs.size} / ${SPEC_IDS.length}`);
  $('startmsg').textContent=partyEver?'お茶会のあとの旅です。また会いに行こう':'前の旅の記録が残っています';
  $('freshwarn').hidden=true;$('fresh').textContent='はじめから';$('start').hidden=false;}
$('start').addEventListener('pointerdown',e=>e.stopPropagation());
$('box1').onclick=e=>{e.stopPropagation();$('start').hidden=true;openBox(()=>{$('start').hidden=false;});};
$('box2').onclick=e=>{e.stopPropagation();$('card').hidden=true;openBox(()=>{$('card').hidden=false;});};
$('card').addEventListener('pointerdown',e=>e.stopPropagation());
$('cont').onclick=e=>{e.stopPropagation();$('start').hidden=true;};
$('fresh').onclick=e=>{e.stopPropagation();
  if($('freshwarn').hidden){$('freshwarn').hidden=false;$('fresh').textContent='消して、はじめから';return;}
  ['hoshikuzu-trips','hoshikuzu-diary','hoshikuzu-pet','hoshikuzu-letters','hoshikuzu-party','hoshikuzu-specimens'].forEach(k=>{try{localStorage.removeItem(k);}catch(err){}});
  trips=0;diaryRead=false;petJoined=false;partyEver=false;specs=new Set();$('start').hidden=true;resetTrip();};
window.addEventListener('resize',resize);resize();startLeg(0);showStart();requestAnimationFrame(loop);
})();
</script>
