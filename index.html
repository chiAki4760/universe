<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="月・エウロパ・木星をめぐる宇宙の旅。メアリー・セレスト号の日記と置き手紙を追いかけよう">
<title>星くずの旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 一画面のゲーム。宇宙の黒をベースにした単一テーマ。 */
:root{
  --space:#05060f;
  --ink:#eef0ff;
  --dim:#9aa0c4;
  --glass:rgba(20,24,52,.62);
  --line:rgba(170,180,255,.22);
  --gold:#ffd27a;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;}
[hidden]{display:none!important;}
body{margin:0;background:var(--space);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;}
.info{display:flex;flex-direction:column;gap:2px;min-width:0;}
.info .label{font-size:12px;color:var(--dim);letter-spacing:.08em;}
.info .big{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(120,140,255,.45);}
.info .sub{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto;}
button{font-family:var(--font);font-weight:700;font-size:13px;color:var(--ink);background:var(--glass);
  border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
button.on{border-color:var(--gold);color:var(--gold);}
button.go{border-color:rgba(255,210,122,.6);}
.hint{position:fixed;left:0;right:0;bottom:0;text-align:center;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-size:13px;line-height:1.5;color:var(--ink);pointer-events:none;transition:opacity .6s;text-shadow:0 1px 2px rgba(0,0,10,.95),0 0 10px rgba(0,0,10,.9);}
.bottombar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
  padding-bottom:calc(58px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.banner{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
  font-size:30px;font-weight:900;letter-spacing:.12em;text-shadow:0 0 24px rgba(255,220,150,.6);opacity:0;transition:opacity .8s;width:90%;}
.banner.hell{color:#ffd2c4;text-shadow:0 0 22px rgba(255,80,50,.9);}
.banner small{display:block;font-size:14px;font-weight:500;letter-spacing:.04em;color:var(--ink);margin-top:8px;text-shadow:0 1px 8px rgba(0,0,0,.9);}
.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 32px));
  background:rgba(14,18,44,.82);border:1px solid var(--line);border-radius:22px;padding:22px 20px;text-align:center;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-sizing:border-box;}
.card h2{margin:0;font-size:26px;font-weight:900;letter-spacing:.1em;text-shadow:0 0 18px rgba(120,170,255,.6);}
.card p{margin:6px 0 14px;color:var(--dim);font-size:13px;}
.card.diary{background:#f4ecd8;border-color:#c9a978;color:#3b2c22;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 18px 50px rgba(0,0,0,.6);}
.diary .dday{margin:0 0 10px;color:#9a6a3a;font-size:13px;font-weight:700;letter-spacing:.1em;text-align:left;}
.diary .dtext{margin:0 0 18px;color:#3b2c22;font-size:16px;line-height:1.95;text-align:left;min-height:7.8em;}
.diary .dnav{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:#9a6a3a;font-variant-numeric:tabular-nums;}
.diary button{color:#3b2c22;background:rgba(120,80,40,.1);border-color:rgba(120,80,40,.35);backdrop-filter:none;-webkit-backdrop-filter:none;}
.diary .dtext{white-space:pre-line;}
.card.diary.letter{background:#e8f0f6;border-color:#9ab4c9;color:#24384a;}
.letter .dday{color:#4f6f8f;}
.letter .dtext{color:#24384a;}
.card.diary.party{background:#fdf0e2;border-color:#e0a878;}
.party .dday{color:#c0603e;}
.rec{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;text-align:left;margin:0 0 18px;font-variant-numeric:tabular-nums;font-size:14px;}
.rec dt{font-weight:700;color:var(--gold);}
.rec dd{margin:0;}
</style>
</head>
<body>
<canvas id="c" aria-label="宇宙を旅して、月・エウロパ・木星の上を歩くゲーム画面"></canvas>

<div class="hud">
  <div class="info">
    <span class="label" id="lab">月まで あと</span>
    <span class="big" id="big">384,400 km</span>
    <span class="sub" id="sub">くだいた隕石 0こ</span>
  </div>
  <div class="btns">
    <button id="snd" type="button" aria-pressed="false">音 オフ</button>
  </div>
</div>

<div class="bottombar" id="walkbar" hidden>
  <button id="grav" type="button">重力：月（地球の1/6）</button>
  <button id="next" type="button" class="go">エウロパへ飛ぶ</button>
</div>

<div class="hint" id="hint">隕石をタップしてくだき、月へ進もう</div>
<div class="banner" id="banner"><span id="bt">月に到着</span><small id="bs">タップで一歩</small></div>

<div class="bottombar" id="shipbar" hidden>
  <button id="shipexit" type="button" class="go">船を出る</button>
</div>

<div class="card diary" id="diary" hidden role="dialog" aria-label="残された日記">
  <p class="dday" id="dday">第1日</p>
  <p class="dtext" id="dtext"></p>
  <div class="dnav"><button id="dprev" type="button">まえ</button><span id="dpg">1 / 7</span><button id="dnext" type="button">つぎ</button></div>
</div>

<div class="card" id="card" hidden>
  <h2>おかえりなさい</h2>
  <p id="trips">地球に帰ってきました</p>
  <dl class="rec" id="rec"></dl>
  <button id="restart" type="button" class="go">もう一度旅に出る</button>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const FONT=getComputedStyle(document.documentElement).getPropertyValue('--font');
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);initStars();}

/* ---------- 星と旅のデータ ---------- */
const STAGES={
  moon:{name:'月',g:1/6,gtxt:'地球の1/6',word:'ジャリ・ジャリ',step:'ジャリ',
    fact:'重力は地球の約1/6。空気がないので、砂ぼこりはそのまま落ちる'},
  europa:{name:'エウロパ',g:.134,gtxt:'地球の約1/7',word:'キーン、キーン',step:'キン',
    fact:'木星の衛星。表面は厚い氷でおおわれ、気温はおよそ−160℃'},
  jupiter:{name:'木星',g:2.53,gtxt:'地球の約2.5倍',word:'ぼよよ〜ん',step:'ふわ',
    fact:'重力は地球の約2.5倍。本当は地面がなく、ここは雲のてっぺん'}
};
const LEGS=[
  {from:'earth',to:'moon',need:30,km:384400,ice:false},
  {from:'moon',to:'europa',need:36,km:628000000,ice:true},
  {from:'europa',to:'jupiter',need:20,km:670900,ice:true}
];
const HELLS={
  moon:{name:'隕石の雨地獄',fact:'空気がないので、小さな隕石も燃えつきずに地面まで降ってくる',how:'落ちてくる隕石にふれて、くだこう',unit:'くだいた隕石'},
  europa:{name:'氷の噴水地獄',fact:'氷の下には海があり、割れ目から水が宇宙へ噴き出しているかもしれない',how:'舞い上がった氷の結晶にふれて、集めよう',unit:'集めた結晶'},
  jupiter:{name:'雷と暴風の地獄',fact:'大赤斑は地球がまるごと入るほどの嵐。風は時速400kmをこえ、雷も光る',how:'タップで風に負けずに進もう。雷の光の玉にもふれてみて',unit:'光の玉'}
};
const HELL_DUR=16;

/* ---------- 音 ---------- */
let AC=null,sound=false,master=null,NB=null;
function ac(){
  if(!AC||AC.state==='closed'){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.7;master.connect(AC.destination);NB=null;}
  if(AC.state!=='running')AC.resume().catch(()=>{});   // suspended だけでなく interrupted（電話や画面ロックのあと）も起こす
  return AC;}
function wake(){if(sound){try{ac();}catch(e){}}}       // 次にふれたとき、止まった音を起こし直す
addEventListener('pointerdown',wake,true);
addEventListener('touchend',wake,true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake();});
addEventListener('pageshow',wake);
function noiseBuf(len){const a=ac(),b=a.createBuffer(1,a.sampleRate*len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
function grain(t,freq,q,dur,vol){const a=ac();if(!NB)NB=noiseBuf(3);const s=a.createBufferSource();s.buffer=NB;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.8);s.stop(t+dur+.02);}
function tone(t,f0,f1,dur,vol,type='sine'){const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}
function sJari(soft){const t=ac().currentTime,v=soft?.25:.5;
  for(let i=0;i<(soft?3:6);i++)grain(t+i*rnd(.018,.04),rnd(1800,4200),rnd(.8,2),rnd(.04,.09),v*rnd(.5,1));
  grain(t,320,.7,.12,v*.6);}
function sKiin(soft){const t=ac().currentTime;
  tone(t,2637,2620,soft?.35:.8,soft?.05:.09);tone(t,3951,3940,soft?.25:.6,.035);grain(t,7000,3,.04,.12);
  if(!soft){tone(t+.2,2794,2780,.8,.08);tone(t+.2,4186,4170,.6,.03);grain(t+.2,7500,3,.04,.1);}}
function sBoyon(){const a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(100,t);o.frequency.linearRampToValueAtTime(250,t+.12);o.frequency.exponentialRampToValueAtTime(140,t+1.2);
  l.frequency.value=7.5;lg.gain.setValueAtTime(55,t);lg.gain.exponentialRampToValueAtTime(2,t+1.2);l.connect(lg);lg.connect(o.frequency);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.3,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+1.3);
  o.connect(g);g.connect(master);o.start(t);l.start(t);o.stop(t+1.35);l.stop(t+1.35);}
function sPuff(){const t=ac().currentTime;grain(t,500,.6,.25,.3);}
function sStep(id){if(!sound)return;if(id==='moon')sJari(true);else if(id==='europa')sKiin(true);else sPuff();tone(ac().currentTime,260,520,.35,.04);}
function sLand(id){if(!sound)return;if(id==='moon')sJari(false);else if(id==='europa')sKiin(false);else sBoyon();}
function sBreak(ice){if(!sound)return;const t=ac().currentTime;
  if(ice){grain(t,5200,2,.12,.5);tone(t,3136,3100,.5,.06);tone(t+.05,4699,4650,.4,.04);tone(t,180,70,.2,.2,'triangle');}
  else{grain(t,rnd(700,1100),1,.18,.7);grain(t+.02,2600,1.5,.1,.35);tone(t,160,55,.25,.35,'triangle');}}
function sChime(){if(!sound)return;const t=ac().currentTime;[523,659,784,1047].forEach((f,i)=>tone(t+i*.16,f,f*.999,1.4,.12));}
function noiseLong(t,dur,freq,q,vol,att,type='bandpass'){const a=ac();if(!NB)NB=noiseBuf(3);const s=a.createBufferSource();s.buffer=NB;s.loop=true;
  const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=a.createGain();
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.linearRampToValueAtTime(vol*.8,t+dur*.7);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.05);}
function sStatic(d){const a=ac(),t=a.currentTime;if(!NB)NB=noiseBuf(3);const s=a.createBufferSource();s.buffer=NB;s.loop=true;
  const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=.5;const g=a.createGain();
  g.gain.setValueAtTime(0,t);for(let k=0;k<d*20;k++)g.gain.setValueAtTime(rnd(.02,.2),t+k*.05);g.gain.setValueAtTime(0,t+d);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.05);
  [0,.12,.24,.6,.72,.84].forEach(o=>tone(t+.4+o,1450,1450,.07,.05,'square'));}
function sBeep(f){const t=ac().currentTime;tone(t,f,f,.18,.06,'square');tone(t,f*2,f*2,.18,.03);}
function sMorse(){const t=ac().currentTime;[0,.1,.2,.45,.55,.8,.9,1,1.3].forEach((o,i)=>{const f=1200+(i%3)*200;tone(t+o,f,f,.07,.05,'square');});}
function sPowan(){const t=ac().currentTime;tone(t,420,880,.6,.1);tone(t+.08,630,1320,.55,.05);}
function sPing(){const t=ac().currentTime;tone(t,1760,1750,.4,.07);tone(t+.06,2637,2630,.4,.05);}
function sThud(){const t=ac().currentTime;grain(t,180,.6,.5,.8);tone(t,110,40,.45,.45,'triangle');}
function sWhistle(){const t=ac().currentTime;tone(t,1800,500,.5,.025);}
function sPlume(){noiseLong(ac().currentTime,1.8,1600,.7,.22,.3);}
function sThunder(){const t=ac().currentTime;grain(t,4200,.6,.12,.7);grain(t+.02,900,.6,.2,.5);noiseLong(t+.05,2,110,.6,.9,.15,'lowpass');}
function sZap(){const t=ac().currentTime;tone(t,1800,3600,.15,.06,'triangle');tone(t+.08,2400,4800,.2,.04);}
function sOminous(){const t=ac().currentTime;tone(t,82,60,2,.22,'triangle');tone(t+.1,123,92,2,.1,'triangle');}

$('snd').onclick=e=>{e.stopPropagation();sound=!sound;if(sound){ac();sChime();}
  $('snd').textContent=sound?'音 オン':'音 オフ';$('snd').classList.toggle('on',sound);$('snd').setAttribute('aria-pressed',sound);};

/* ---------- 星空 ---------- */
let stars=[];
function initStars(){stars=[];const n=Math.round(W*H/2600);for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:rnd(.2,1),tw:rnd(0,6.28)});}
function drawStars(dt,speed,camX,alpha=1){for(const s of stars){s.y+=speed*s.z*dt;if(s.y>H){s.y-=H;s.x=Math.random()*W;}
  s.tw+=dt*2;const a=(.35+.45*s.z*(.75+.25*Math.sin(s.tw)))*alpha;let x=s.x;if(camX!==undefined){x=((s.x-camX*.04*s.z)%W+W)%W;}
  cx.fillStyle=`rgba(225,230,255,${a})`;cx.fillRect(x,s.y,s.z*1.8,s.z*1.8);}}

/* ---------- 星の絵 ---------- */
const moonSpots=[...Array(14)].map(()=>({a:rnd(0,6.28),d:Math.sqrt(Math.random())*.8,r:rnd(.05,.17)}));
function glowDisc(x,y,r,stops,glow){const g=cx.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);stops.forEach(([o,c])=>g.addColorStop(o,c));
  cx.save();cx.shadowColor=glow;cx.shadowBlur=r*.4;cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();cx.restore();}
function shade(x,y,r,from=.62,a=.55){const sh=cx.createLinearGradient(x-r,y,x+r,y);sh.addColorStop(0,'rgba(0,0,10,0)');sh.addColorStop(from,'rgba(0,0,10,0)');sh.addColorStop(1,`rgba(0,0,15,${a})`);cx.fillStyle=sh;cx.fillRect(x-r,y-r,r*2,r*2);}
function drawMoon(x,y,r){
  glowDisc(x,y,r,[[0,'#f1efe8'],[.7,'#c9c6bd'],[1,'#8e8b84']],'rgba(230,230,255,.35)');
  cx.save();cx.beginPath();cx.arc(x,y,r,0,7);cx.clip();
  for(const s of moonSpots){const sx=x+Math.cos(s.a)*s.d*r,sy=y+Math.sin(s.a)*s.d*r;
    cx.fillStyle='rgba(110,106,100,.35)';cx.beginPath();cx.arc(sx,sy,s.r*r,0,7);cx.fill();
    cx.strokeStyle='rgba(255,255,250,.25)';cx.lineWidth=Math.max(.5,r*.012);cx.beginPath();cx.arc(sx-s.r*r*.15,sy-s.r*r*.15,s.r*r,Math.PI*.9,Math.PI*1.7);cx.stroke();}
  shade(x,y,r);cx.restore();}
function drawEarth(x,y,r){
  glowDisc(x,y,r,[[0,'#7fc3ff'],[.7,'#2c6fd1'],[1,'#163a8a']],'rgba(90,160,255,.6)');
  cx.save();cx.beginPath();cx.arc(x,y,r,0,7);cx.clip();
  cx.fillStyle='rgba(80,170,110,.85)';
  [[-.3,-.1,.32,.22],[.25,.2,.28,.18],[.1,-.45,.18,.12]].forEach(([a,b,c,d])=>{cx.beginPath();cx.ellipse(x+a*r,y+b*r,c*r,d*r,.4,0,7);cx.fill();});
  cx.fillStyle='rgba(255,255,255,.75)';
  [[-.5,.35,.35,.06],[.2,-.25,.4,.05],[-.1,.6,.3,.05]].forEach(([a,b,c,d])=>{cx.beginPath();cx.ellipse(x+a*r+Math.sin(T*.3)*r*.05,y+b*r,c*r,d*r,0,0,7);cx.fill();});
  const sh=cx.createLinearGradient(x-r,y,x+r,y);sh.addColorStop(0,'rgba(0,0,15,.6)');sh.addColorStop(.45,'rgba(0,0,15,0)');cx.fillStyle=sh;cx.fillRect(x-r,y-r,r*2,r*2);
  cx.restore();}
const euLines=[...Array(11)].map(()=>{const a=rnd(0,6.28),pts=[];let px=rnd(-1,1),py=rnd(-1,1);for(let i=0;i<6;i++){pts.push([px,py]);px+=Math.cos(a)*.35+rnd(-.1,.1);py+=Math.sin(a)*.35+rnd(-.1,.1);}return pts;});
function drawEuropa(x,y,r){
  glowDisc(x,y,r,[[0,'#fbf7ee'],[.7,'#ddd1bd'],[1,'#9c907d']],'rgba(230,230,255,.35)');
  cx.save();cx.beginPath();cx.arc(x,y,r,0,7);cx.clip();
  cx.strokeStyle='rgba(150,78,48,.55)';cx.lineWidth=Math.max(.6,r*.018);cx.lineCap='round';
  for(const l of euLines){cx.beginPath();l.forEach(([a,b],i)=>i?cx.lineTo(x+a*r,y+b*r):cx.moveTo(x+a*r,y+b*r));cx.stroke();}
  cx.fillStyle='rgba(170,110,80,.18)';cx.beginPath();cx.ellipse(x-r*.2,y+r*.3,r*.45,r*.3,.5,0,7);cx.fill();
  shade(x,y,r);cx.restore();}
const JB=['#efe3cb','#c99b6d','#f2e7d2','#b9825a','#e6cfab','#a8714d','#f1e5cd','#c4946a','#e9d8bd','#b07a52','#f0e3c8'];
function drawJupiter(x,y,r,shadeA=.55){

function makeMeteor(){
  const leg=LEGS[L],r=rnd(18,34)*(Math.min(W,H)/420+.4)*.8;

  else if(side<.75){x=-r;y=rnd(H*.1,H*.6);vx=rnd(30,60);vy=rnd(10,40);}
  else{x=W+r;y=rnd(H*.1,H*.6);vx=-rnd(30,60);vy=rnd(10,40);}
  const pts=[...Array(10)].map((_,i)=>({a:i/10*6.283,k:rnd(.72,1.08)}));
  const pits=[...Array(3)].map(()=>({a:rnd(0,6.28),d:rnd(0,.5),r:rnd(.12,.22)}));
  return {x,y,vx,vy,r,rot:rnd(0,6.28),vr:rnd(-.8,.8),pts,pits,ice:leg.ice&&Math.random()<.8,hue:rnd(18,34)};
}
function drawRock(m){
  cx.save();cx.translate(m.x,m.y);cx.rotate(m.rot);
  const g=cx.createRadialGradient(-m.r*.4,-m.r*.4,m.r*.1,0,0,m.r*1.1);
  if(m.ice){g.addColorStop(0,'rgba(240,250,255,.95)');g.addColorStop(.6,'rgba(150,200,235,.85)');g.addColorStop(1,'rgba(70,120,170,.8)');}
  else{g.addColorStop(0,`hsl(${m.hue},18%,62%)`);g.addColorStop(1,`hsl(${m.hue},22%,24%)`);}
  cx.fillStyle=g;cx.beginPath();m.pts.forEach((p,i)=>{const px=Math.cos(p.a)*m.r*p.k,py=Math.sin(p.a)*m.r*p.k;i?cx.lineTo(px,py):cx.moveTo(px,py);});cx.closePath();cx.fill();
  cx.strokeStyle=m.ice?'rgba(255,255,255,.6)':`hsla(${m.hue},40%,80%,.25)`;cx.lineWidth=1.2;cx.stroke();
  if(m.ice){cx.strokeStyle='rgba(255,255,255,.55)';cx.beginPath();cx.moveTo(-m.r*.5,-m.r*.1);cx.lineTo(m.r*.1,-m.r*.5);cx.moveTo(-m.r*.2,m.r*.3);cx.lineTo(m.r*.4,0);cx.stroke();}
  else for(const p of m.pits){cx.fillStyle='rgba(20,14,10,.35)';cx.beginPath();cx.arc(Math.cos(p.a)*p.d*m.r,Math.sin(p.a)*p.d*m.r,p.r*m.r,0,7);cx.fill();}
  cx.restore();}
function breakMeteor(m){

  for(let i=0;i<16;i++){const a=rnd(0,6.283),sp=rnd(20,120);shards.push({x:m.x,y:m.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:rnd(1,2.6),life:1,dust:true,col:m.ice?'200,235,255':'255,220,160'});}

function groundY(){return H*.72;}
function hash(n){const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s);}
function surfY(wx){const gy=groundY();if(cur!=='jupiter')return gy;
  return gy+Math.sin(wx*.015+T*1.2)*4+squash*16*Math.exp(-Math.pow((wx-player.x)/45,2));}
function hop(){
  if(player.air){floats.push({x:player.x,y:surfY(player.x)-player.h-110,txt:cur==='jupiter'?'ぼよん':'ふわ〜',life:.8,small:true});return;}
  player.air=true;player.vy=V0;player.bounce=0;player.steps++;
  player.vx=VX*(gMode==='earth'?.55:cur==='jupiter'?.7:1);
  kick(player.x,.6);sStep(cur);if(pet&&!pet.air){pet.air=true;pet.vy=V0*.8;}
  floats.push({x:player.x-10,y:surfY(player.x)-20,txt:STAGES[cur].step,life:.9,small:true});}
function land(){
  if(cur==='jupiter'&&player.bounce<3){
    if(player.bounce===0){sLand(cur);floats.push({x:player.x,y:surfY(player.x)-40,txt:STAGES[cur].word,life:1.4});}
    player.vy=900*Math.pow(.55,player.bounce)*(gMode==='earth'?.6:1);player.bounce++;player.h=.01;squash=1;kick(player.x,.7);return;}
  player.air=false;player.h=0;player.vy=0;
  if(cur!=='jupiter'){foot.push({x:player.x-6,s:1,t:T},{x:player.x+7,s:-1,t:T});if(foot.length>240)foot.splice(0,foot.length-240);}
  kick(player.x,1);if(cur!=='jupiter'){sLand(cur);floats.push({x:player.x,y:surfY(player.x)-30,txt:STAGES[cur].word,life:1.2});}

    parts.push({kind:cur==='europa'?'glint':'dust',x:x+rnd(-8,8),h:2,vx:Math.cos(a)*sp,vy:-Math.sin(a)*sp,life:1,r:rnd(1,2.4)});}}

function fmtKm(n){n=Math.max(0,Math.round(n));if(n>=1e8)return (n/1e8).toFixed(2)+'億 km';if(n>=1e4&&n>=1e6)return Math.round(n/1e4).toLocaleString()+'万 km';return n.toLocaleString()+' km';}

  if(ev&&ev.type==='hell'){const h=HELLS[ev.id];$('lab').textContent=h.name;
    $('big').textContent=ev.t<HELL_DUR?`のこり ${Math.ceil(HELL_DUR-ev.t)} 秒`:'しずまってきた…';$('sub').textContent=`${h.unit} ${ev.score}こ`;return;}
  if(phase==='walk'){$('lab').textContent=`${STAGES[cur].name}　歩いたきょり`;$('big').textContent=(player.x/PXM).toFixed(1)+' m';
    $('sub').textContent=`${player.steps}歩　いちばん高く ${(player.maxH/PXM).toFixed(2)} m`;}
  else if(phase==='home'||phase==='end'){$('lab').textContent='地球へ';$('big').textContent='帰り道';$('sub').textContent=`くだいた隕石と氷 ${totalBroken}こ`;}

  }else if(phase==='home'){if(shipTap(px,py))return;if(ev&&ev.type==='radio')radioTap(px,py);}

    if(f.sub){cx.font=`700 12px ${FONT}`;cx.fillStyle='#bfc6ff';cx.fillText(f.sub,fx,f.y+17);}
    cx.shadowBlur=0;cx.globalAlpha=1;}}

function frameFly(dt,landing){
  const leg=LEGS[L];
  progressShown+=(progress-progressShown)*Math.min(1,dt*3);
  const p=ease(progressShown),lt=landing?Math.min(1,landT/2.4):0,base=Math.min(W,H);
  cx.fillStyle='#05060f';cx.fillRect(0,0,W,H);
  const neb=cx.createRadialGradient(W*.6,H*.2,10,W*.6,H*.2,Math.max(W,H)*.8);
  neb.addColorStop(0,leg.ice?'rgba(120,80,60,.22)':'rgba(60,50,120,.25)');neb.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=neb;cx.fillRect(0,0,W,H);
  drawStars(dt,20+p*40+lt*400);
  const er=lerp(base*.42,base*.05,p);drawBody(leg.from,W*.22,H+er*.35-p*H*.1,er);
  const big=leg.to==='jupiter'?.42:.3;
  let mr=lerp(base*.03,base*big,p),my=lerp(H*.18,H*.26,p);
  if(landing){mr=lerp(mr,base*3.2,ease(lt));my=lerp(my,H*.4+base*3.2*.75,ease(lt));}
  drawBody(leg.to,W*.62,my,mr);
  if(ship){updateShip(dt);if(ship)drawShip(ship.x,ship.y,ship.s,ship.stage,shipAlpha());}
  if(!landing&&!ev&&!(ship&&ship.stage===3)){spawnT-=dt;if(spawnT<=0&&meteors.length<7){meteors.push(makeMeteor());spawnT=rnd(.5,1.1);}}
  for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.x+=m.vx*dt;m.y+=m.vy*dt;m.rot+=m.vr*dt;
    if(m.x<-80||m.x>W+80||m.y>H+80){meteors.splice(i,1);continue;}drawRock(m);}
  for(let i=shards.length-1;i>=0;i--){const s=shards[i];s.life-=dt*(s.dust?1.2:.9);if(s.life<=0){shards.splice(i,1);continue;}
    s.x+=s.vx*dt;s.y+=s.vy*dt;cx.globalAlpha=Math.max(0,s.life);

function frameWalk(dt){
  phaseT+=dt;const gy=groundY(),g=gNow();
  if(ev&&ev.type==='hell')updateHell(dt);
  const he=ev&&ev.type==='hell'?ev:null;
  if(player.air){player.vy-=g*dt;player.h+=player.vy*dt;player.x+=player.vx*dt;player.maxH=Math.max(player.maxH,player.h);
    if(player.h<=0)land();}
  if(he&&he.id==='jupiter')player.x-=(player.air?30:75)*he.wind*dt;
  squash=Math.max(0,squash-dt*2.2);shake=Math.max(0,shake-dt*30);

  camY=lerp(camY,Math.max(0,player.h+110*s-gy*.82),Math.min(1,dt*5));

  if(cur==='moon')groundMoon(gy);else if(cur==='europa')groundEuropa(gy);else groundJupiter(gy);
  if(presence&&cur!=='jupiter')drawPresence(gy);

  for(const f of foot){const x=f.x-camX;if(x<-20||x>W+20)continue;const yy=gy+(f.s>0?6:10);

      cx.strokeStyle='rgba(40,38,36,.5)';cx.lineWidth=.8;for(let k=-3;k<=3;k+=2){cx.beginPath();cx.moveTo(x+k,yy-1.5);cx.lineTo(x+k,yy+1.5);cx.stroke();}}
    else{cx.fillStyle='rgba(120,160,195,.45)';cx.beginPath();cx.ellipse(x,yy,6,2.2,0,0,7);cx.fill();cx.strokeStyle='rgba(255,255,255,.7)';cx.lineWidth=.8;cx.beginPath();cx.moveTo(x-5,yy-1);cx.lineTo(x+4,yy-1.6);cx.stroke();}}

  for(let i=parts.length-1;i>=0;i--){const d=parts[i];
    if(d.kind==='puff'){d.x+=d.vx*dt;d.h+=d.vy*dt;d.r+=dt*14;d.life-=dt*.9;}
    else if(d.kind==='vapor'){d.vy*=Math.pow(.3,dt);d.x+=d.vx*dt;d.h+=d.vy*dt;d.r+=dt*12;d.life-=dt*.55;}
    else{d.vy-=g*.5*dt;d.h+=d.vy*dt;d.x+=d.vx*dt;if(d.h<=0){d.h=0;d.life-=dt*2.5;}d.life-=dt*.15;}
    if(d.life<=0){parts.splice(i,1);continue;}

    if(d.kind==='puff'){cx.fillStyle=`rgba(252,242,224,${d.life*.6})`;cx.beginPath();cx.arc(x,surfY(d.x)-d.h,d.r,0,7);cx.fill();}
    else if(d.kind==='vapor'){cx.fillStyle=`rgba(225,242,255,${d.life*.32})`;cx.beginPath();cx.arc(x,y,d.r,0,7);cx.fill();}
    else if(d.kind==='glint'){const a=d.life*(.6+.4*Math.sin(T*20+i));cx.strokeStyle=`rgba(230,248,255,${a})`;cx.lineWidth=1;cx.beginPath();cx.moveTo(x-2.5,y);cx.lineTo(x+2.5,y);cx.moveTo(x,y-2.5);cx.lineTo(x,y+2.5);cx.stroke();}

function startRadio(kind){

  ev={type:'radio',kind,stage:'noise',t:0,rings:[],tuned:0,dust:[],got:0,dropT:0,dkm,from:kind==='go'?'木星のほう':'地球のほう',

function updateRadio(dt){
  const e=ev;e.t+=dt;
  if(e.stage==='noise'&&e.t>2.2){e.stage='tune';e.t=0;newRing();$('hint').textContent='光る点にふれて、電波を合わせよう';}

    $('hint').textContent=e.kind==='go'?'光る生き物が近づいてきた。こぼれる星くずにふれてみよう':allLetters()?'あの生き物が、むかえに来てくれた。どこかへ案内したいみたい':'あの生き物が、見送りに来てくれた';if(sound)sPowan();}
  else if(e.stage==='visit'){
    const j=e.jelly,dur=e.kind==='go'?12:8,leaving=e.t>dur-2.2;
    j.ph+=dt;j.glow=Math.max(0,j.glow-dt*1.5);
    const tx=leaving?W*.7:W*.6,ty=leaving?-160:H*.4+Math.sin(j.ph*1.3)*18;
    j.x=lerp(j.x,tx,Math.min(1,dt*(leaving?1.2:1.4)));j.y=lerp(j.y,ty,Math.min(1,dt*(leaving?1.1:2)));
    e.dropT-=dt;if(!leaving&&e.dropT<=0&&e.dust.length<8){e.dropT=e.kind==='go'?.55:.9;
      e.dust.push({x:j.x+rnd(-20,20),y:j.y+30,vx:rnd(-45,45),vy:rnd(10,40),life:1,rot:rnd(0,6)});}
    for(let i=e.dust.length-1;i>=0;i--){const d=e.dust[i];d.x+=d.vx*dt;d.y+=d.vy*dt;d.vx*=.99;d.rot+=dt*2;d.life-=dt*.13;if(d.life<=0||d.y>H+20)e.dust.splice(i,1);}

      floats.push({x:W*.5,y:H*.45,txt:e.kind==='go'?'なにかと、すれちがった…':'またいつか',sub:`星くず ${e.got}こ`,life:1.6});
      if(phase==='fly')$('hint').textContent='氷のかけらや隕石をタップしてくだき、先へ進もう';else $('hint').style.opacity=0;}}}

function drawStarBit(x,y,r,rot,a){cx.save();cx.translate(x,y);cx.rotate(rot);cx.globalAlpha=Math.min(1,a*2);cx.fillStyle='#ffe28a';

  if(G.jelly.on){const j=G.jelly;drawJelly(j.x,j.y,Math.min(1.2,Math.max(.8,Math.min(W,H)/450)),jellyGlow,T,true);}
  // 星くずの紙ふぶき
  for(let i=0;i<10;i++){const x=(hash(i*3.7)*W+T*12*(i%2?1:-1)+W)%W,y=(hash(i*1.9)*H*.6+T*18)%(H*.7);drawStarBit(x,y,4,T+i,.35+.25*Math.sin(T*2+i));}}
function partyTap(px,py){const G=guestPos(),R2={writer:['ふふっ','おかわり、いかが？','来てくれて、ありがとう'],jelly:['ふわん','ふわわん♪'],mole:['ズズッ','ぴょこっ'],
  whale:['ボォォ〜ン'],pet:['キュッ！','キュルン！'],me:['いただきます！','あったかい…']};
  for(const k of ['jelly','pet','mole','writer','me','whale']){const g=G[k];if(!g.on)continue;
    if(Math.hypot(px-g.x,py-g.y)<g.r+10){partyTaps[k]=(partyTaps[k]||0)+1;const L2=R2[k];
      floats.push({x:g.x,y:g.y-g.r-6,txt:L2[(partyTaps[k]-1)%L2.length],life:1.2,small:true});
      if(k==='whale')sWhale();else if(k==='pet')sSqueak();else if(k==='jelly'){jellyGlow=1;if(sound)sPowan();}else if(sound)sPing();
      return;}}}

/* ---------- 地球との通信（光の速さの遅れ） ---------- */
const LIGHT_KM=299792;           // 光と電波が1秒に進むきょり（km）
const COMM={                      // 地球までのきょり（エウロパ・木星は、いちばん近いころの目安）
  moon:{km:384400,speed:1,send:'もしもし、地球？',reply:'キコエルヨ！'},
  europa:{km:628e6,speed:300,send:'コチラ エウロパ',reply:'コチラ チキュウ。キコエタヨ'},
  jupiter:{km:628e6,speed:300,send:'コチラ モクセイ',reply:'コチラ チキュウ。オカエリ'}};
let comm=null,commUsed={};
function fmtDelay(sec){if(sec<60)return `約${sec.toFixed(1)}秒`;const m=Math.floor(sec/60),r=Math.round(sec%60);return r?`約${m}分${r}秒`:`約${m}分`;}
function earthPos(){if(cur==='moon')return {x:W*.8,y:H*.17,r:Math.min(W,H)*.065};
  return cur==='europa'?{x:W*.16+22,y:H*.13+12,r:3}:{x:W*.22+24,y:H*.2+12,r:3};}
function drawTinyEarth(){const e=earthPos();cx.save();cx.fillStyle='#7fc3ff';cx.shadowColor='rgba(120,190,255,1)';cx.shadowBlur=8;
  cx.beginPath();cx.arc(e.x,e.y,e.r,0,7);cx.fill();cx.restore();
  cx.font=`700 10px ${FONT}`;cx.textAlign='center';cx.fillStyle='rgba(190,215,255,.75)';cx.fillText('地球',e.x,e.y+16);}
function astroSky(){const s=Math.min(1.3,Math.max(.8,H/700));return {x:W*.32+8*s,y:surfY(player.x)+6-player.h-90*s+camY};}
function commTap(px,py){if(comm||ev)return false;const e=earthPos();
  if(Math.hypot(px-e.x,py-e.y)>Math.max(34,e.r+14))return false;
  const c=COMM[cur];comm={id:cur,stage:'up',p:0,t:0,c};commUsed[cur]=true;
  floats.push({x:camX+W*.32,y:groundY()-150,txt:c.send,life:1.4,small:true});
  $('hint').textContent=c.speed>1?`地球へ送信！ 光の速さでも片道${fmtDelay(c.km/LIGHT_KM)}。（${c.speed}倍の早送りで見てみよう）`:'地球へ送信！ 電波が光の速さで飛んでいく…';
  if(sound)sBeep(900);return true;}
function updateComm(dt){const m=comm;if(!m)return;m.t+=dt;const one=m.c.km/LIGHT_KM;
  if(m.stage==='up'||m.stage==='down'){m.p+=dt*m.c.speed/one;
    if(m.p>=1){m.p=0;
      if(m.stage==='up'){m.stage='wait';m.t=0;if(sound)sPing();
        $('hint').textContent=m.c.speed>1?`地球にとどいた！ 返事がもどってくるのにも、また${fmtDelay(one)}かかる…`:'地球にとどいた！ 返事を待とう…';}
      else{m.stage='done';m.t=0;if(sound){sPowan();sPing();}
        floats.push({x:camX+W*.32,y:groundY()-160,txt:m.c.reply,life:1.8});
        $('hint').textContent=m.id==='moon'
          ?'月と地球は、電波で片道約1.3秒。だからおしゃべりすると、返事まで約2.6秒かかるんだ'
          :`ここから地球までは、光の速さでも片道${fmtDelay(one)}。返事が来るまで、ほんとうは1時間以上かかるんだ`;}}}
  else if(m.stage==='wait'&&m.t>(m.c.speed>1?1.2:.15)){m.stage='down';}
  else if(m.stage==='done'&&m.t>3)comm=null;}
function drawComm(){const m=comm;if(!m)return;const e=earthPos(),a=astroSky(),one=m.c.km/LIGHT_KM;
  const up=m.stage==='up',moving=up||m.stage==='down',q=moving?m.p:m.stage==='wait'?1:1;
  const from=up?a:e,to=up?e:a;
  // 電波の通り道
  cx.save();cx.setLineDash([3,7]);cx.strokeStyle='rgba(140,255,220,.25)';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(e.x,e.y);cx.stroke();cx.setLineDash([]);
  if(moving){const x=lerp(from.x,to.x,q),y=lerp(from.y,to.y,q);
    for(let k=0;k<3;k++){const r=6+((T*3+k/3)%1)*14;cx.strokeStyle=`rgba(140,255,220,${.7-(r-6)/20})`;cx.lineWidth=1.5;cx.beginPath();cx.arc(x,y,r,0,7);cx.stroke();}
    cx.fillStyle='#e8fff7';cx.shadowColor='rgba(120,255,210,1)';cx.shadowBlur=14;cx.beginPath();cx.arc(x,y,4,0,7);cx.fill();}
  else if(m.stage==='wait'){cx.strokeStyle=`rgba(140,255,220,${.5+.4*Math.sin(T*8)})`;cx.lineWidth=2;cx.beginPath();cx.arc(e.x,e.y,e.r+8,0,7);cx.stroke();}
  cx.restore();
  // メーター
  const w=Math.min(300,W-32),x0=(W-w)/2,y0=Math.max(110,H*.25),total=one*2;
  const done=m.stage==='up'?m.p*one:m.stage==='wait'?one:m.stage==='down'?one+m.p*one:total;
  cx.save();cx.globalAlpha=m.stage==='done'?Math.max(0,1-(m.t-1.5)/1.5):1;
  cx.fillStyle='rgba(14,18,44,.78)';cx.strokeStyle='rgba(140,255,220,.4)';cx.lineWidth=1;cx.beginPath();cx.roundRect(x0,y0,w,58,14);cx.fill();cx.stroke();
  cx.font=`700 12px ${FONT}`;cx.textAlign='left';cx.fillStyle='#bfffe9';
  cx.fillText(m.stage==='up'?'送信中 → 地球':m.stage==='wait'?'地球にとどいた':m.stage==='down'?'返事が飛んでくる ←':'返事がとどいた！',x0+12,y0+20);
  cx.textAlign='right';cx.fillStyle='rgba(191,255,233,.8)';cx.fillText(m.c.speed>1?`早送り ×${m.c.speed}`:'ほんとうの速さ',x0+w-12,y0+20);
  cx.fillStyle='rgba(255,255,255,.12)';cx.beginPath();cx.roundRect(x0+12,y0+28,w-24,6,3);cx.fill();
  cx.fillStyle='#8cffdc';cx.beginPath();cx.roundRect(x0+12,y0+28,(w-24)*Math.min(1,done/total),6,3);cx.fill();
  cx.fillStyle='rgba(255,255,255,.35)';cx.fillRect(x0+12+(w-24)/2-1,y0+26,2,10);
  cx.font=`500 11px ${FONT}`;cx.textAlign='left';cx.fillStyle='#d9e2ff';
  cx.fillText(`往復 ${fmtDelay(total)} のうち ${fmtDelay(Math.min(done,total)).replace('約','')}`,x0+12,y0+50);
  cx.restore();}

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  if(phase==='fly')frameFly(dt,false);else if(phase==='landing')frameFly(dt,true);
  else if(phase==='walk')frameWalk(dt);else if(phase==='ship'||phase==='party')frameShip(dt);else frameHome(dt);
  requestAnimationFrame(loop);}
window.addEventListener('resize',resize);resize();startLeg(0);requestAnimationFrame(loop);
})();
</script>
